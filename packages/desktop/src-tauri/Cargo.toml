[package]
name = "mpp-desktop"
version = "0.11.0-rc.1"
description = "多平台内容发布工具 — 桌面端(Tauri 2 + Rust 终端桥)"
authors = ["yogsthoth1"]
edition = "2021"

[lib]
name = "mpp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-global-shortcut = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
