name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      # 生产依赖漏洞扫描(--omit=dev:开发期工具链(vitest/vite)漏洞不阻塞发布,
      # 只强制关注 server/扩展运行时依赖的安全)。
      - name: 生产依赖漏洞扫描
        run: npm audit --omit=dev --audit-level=high

      # 构建产物验证:core 类型构建 + 扩展 MV3 产物,确保可发布。
      - name: 构建产物验证
        run: |
          npm run build:core
          npm run build:ext
